# /etc/nginx/sites-available/authforge-server
#
# Certbot rewrites this file when it issues the certificate, adding the 443
# server block and the redirect. Keep the proxy settings here so re-running
# certbot does not lose them.
#
# This box also serves kagazz (8001) and planmytrip (8003); nginx routes by
# server_name, so the only thing that makes this file authforge's is the domain
# below and the upstream port.
server {
    listen 80;
    server_name server.authforge.sanjeevnode.in;

    access_log /var/log/nginx/authforge-access.log;
    error_log  /var/log/nginx/authforge-error.log;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The refresh cookie is Secure + cross-subdomain; without this the app
        # cannot tell it is behind TLS and will refuse to set it.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
