# Production stack for EC2. Differences from docker-compose.yml (dev):
#  - postgres/redis have NO host ports (internal-only, per security conventions)
#  - app has no bind mount and no --reload
#  - nginx is the only service on 80/443
#  - pgAdmin dropped (use an SSH tunnel if you ever need it)
#
# Run:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # no ports: -> reachable only by other compose services, never the public IP

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # no ports: -> internal only

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    # no ports published: nginx reaches it over the compose network as app:8000
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro          # ACME challenge files
      - certbot_conf:/etc/letsencrypt:ro          # issued certs (added to config after issuance)
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # started on-demand to issue/renew; no long-running command by default
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"]

volumes:
  pgdata:
  certbot_www:
  certbot_conf:
