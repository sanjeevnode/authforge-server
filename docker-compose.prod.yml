# Production stack for EC2. Differences from docker-compose.yml (dev):
#  - no postgres service: the database is RDS (see DATABASE_URL in .env.prod)
#  - no redis service: uses the shared instance in ~/shared, db 1
#  - app has no bind mount and no --reload
#  - nginx runs natively on the host (see /etc/nginx), not in Docker
#  - pgAdmin dropped (use an SSH tunnel if you ever need it)
#
# Run:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# This box also runs kagazz (8001) and planmytrip (8003), so the app is
# published on 8002 — localhost only, so host-nginx can reach it and the public
# internet cannot.

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:8002:8000"
    # The Dockerfile CMD ends in --reload, which must not run in production.
    # This override is load-bearing, not redundant.
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      # External network owned by ~/shared/docker-compose.yml, which must be up
      # first. Keeps Redis reachable by service name across compose projects.
      - shared

networks:
  shared:
    external: true
    name: shared
