# Host nginx site for AuthForge. Deployed to
# /etc/nginx/sites-available/authforge -> symlinked into sites-enabled.
# certbot --nginx will add the 443 server block + redirect automatically.

server {
    listen 80;
    server_name server.authforge.sanjeevnode.in;

    location / {
        proxy_pass http://127.0.0.1:8000;      # app container, localhost-published
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
