# AuthForge reverse proxy. HTTP-only to start so certbot can validate the domain;
# once the cert is issued we add the 443 server block (see nginx.conf notes).

events {}

http {
    # Docker's embedded DNS, so we can resolve the 'app' service name.
    server {
        listen 80;
        server_name server.authforge.sanjeevnode.in;

        # Let's Encrypt ACME HTTP-01 challenge files are served from here.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
